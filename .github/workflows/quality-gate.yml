name: Core V5 foundation quality gate

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "core/**"
      - "docs/**"
      - "schemas/**"
      - "evaluation/**"
      - "scripts/**"
      - "AGENTS.md"
      - "GOVERNANCE.md"
      - "README.md"
      - "package.json"
      - ".github/workflows/quality-gate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate foundation artifacts
        run: npm run check
