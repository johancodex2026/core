name: Core V5 unified assurance suite

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "core/**"
      - "docs/**"
      - "schemas/**"
      - "evaluation/**"
      - "planning/**"
      - "governance/**"
      - "assurance/**"
      - "scripts/**"
      - "AGENTS.md"
      - "GOVERNANCE.md"
      - "README.md"
      - "CHANGELOG.md"
      - "package.json"
      - ".github/**"

permissions:
  contents: read

jobs:
  unified-assurance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run the single canonical suite
        run: npm test

      - name: Upload unified assurance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-v5-assurance-report
          path: artifacts/core-v5-assurance-report.json
          if-no-files-found: error
          retention-days: 30

      - name: State assurance boundary
        if: always()
        run: |
          echo "PASS proves conformance to declared repository controls and known deterministic failure classes."
          echo "It does not prove universal absence of hallucination, consciousness, identity, continuity, runtime safety or promotion."
