name: Core V5 structural gate

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "core/**"
      - "docs/**"
      - "schemas/**"
      - "evaluation/**"
      - "scripts/**"
      - "AGENTS.md"
      - "GOVERNANCE.md"
      - "README.md"
      - "CHANGELOG.md"
      - "package.json"
      - ".github/workflows/quality-gate.yml"

permissions:
  contents: read

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate structural contracts and G0 boundaries
        run: npm run check:structure

      - name: State assurance boundary
        run: echo "Structural PASS is not behavioral, security, identity, continuity, or gate approval."
