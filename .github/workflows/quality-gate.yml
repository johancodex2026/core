name: Core V5 foundation and planning gates

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "core/**"
      - "docs/**"
      - "schemas/**"
      - "evaluation/**"
      - "planning/**"
      - "governance/**"
      - "scripts/**"
      - "AGENTS.md"
      - "GOVERNANCE.md"
      - "README.md"
      - "CHANGELOG.md"
      - "package.json"
      - ".github/**"

permissions:
  contents: read

jobs:
  foundation-and-planning-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate foundation and planning contracts
        run: npm run check

      - name: State assurance boundary
        run: |
          echo "PASS validates repository structure and planning doctrine only."
          echo "It does not prove READY, behavior, security, identity, continuity, runtime, or gate approval."
