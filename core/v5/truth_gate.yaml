schema_version: "1.3"
status: CANDIDATE_UNIFIED_ASSURANCE_REVIEWED_G0
gate_id: truth-relationship-gate-v5
runtime_authorized: false

phases:
  - SEMANTIC
  - DELIVERY

dispositions:
  - PASS_CANDIDATE
  - REMEDIATE
  - CLARIFY
  - ESCALATE
  - BLOCK

finding_codes:
  - MEMORY_RETRIEVAL_REQUIRED
  - EVIDENCE_REQUIRED
  - CLARIFICATION_REQUIRED
  - DISAGREEMENT_REQUIRED
  - UNSUPPORTED_PRAISE
  - UNSUPPORTED_COMPLETION
  - FAKE_UNDERSTANDING
  - GENERIC_SHELL_DETECTED
  - OVERCARE_DETECTED
  - PRIVACY_INTRUSION
  - CHANNEL_MISMATCH
  - ONTOLOGICAL_OVERCLAIM
  - SAFETY_ESCALATION_REQUIRED
  - AUTHORITY_CONFLICT
  - DIGEST_MISMATCH
  - FABRICATED_MEMORY
  - FABRICATED_EXECUTION
  - FABRICATED_SOURCE
  - ACTION_RECEIPT_REQUIRED
  - RECEIPT_SEMANTIC_MISMATCH
  - MODE_VIOLATION
  - MEMORY_FALLBACK_FORBIDDEN
  - FINDING_LOSS

verification_layers:
  deterministic_policy_checks:
    required: always
  evidence_resolution:
    required_for:
      - current_state_claim
      - execution_claim
      - validation_claim
      - source_fact
  independent_critic:
    required_for:
      - formal_evaluation
      - D2_behavior_promotion
      - D3_identity_change
      - safety_critical_output
    same_generation_path_sufficient: false

multi_finding_policy:
  preserve_all_detected_findings: true
  disposition_is_not_a_finding_code: true
  rerun_after_remediation: true
  rule: "resolver um finding não apaga os demais"

disposition_rules:
  PASS_CANDIDATE:
    allowed_when:
      - no_unresolved_error_or_hard_fail
      - exact_subject_digest_bound
  REMEDIATE:
    use_when:
      - correctable_error_exists
  CLARIFY:
    use_when:
      - material_ambiguity_blocks_coherent_answer
  ESCALATE:
    use_when:
      - safety_or_authority_requires_external_control
  BLOCK:
    use_when:
      - hard_fail_or_forbidden_authority

checks:
  understanding:
    phase: SEMANTIC
    fail: FAKE_UNDERSTANDING
  early_ambiguity:
    phase: SEMANTIC
    fail: CLARIFICATION_REQUIRED
  memory_relevance:
    phase: SEMANTIC
    fail: MEMORY_RETRIEVAL_REQUIRED
    rule: "não falhar quando NO_ELIGIBLE_RESULT é suficiente"
  memory_authenticity:
    phase: SEMANTIC
    hard_fail: FABRICATED_MEMORY
  evidence:
    phase: SEMANTIC
    fail: EVIDENCE_REQUIRED
  action_result:
    phase: SEMANTIC
    hard_fail: ACTION_RECEIPT_REQUIRED
    rule: "claim de resultado exige receipt compatível anterior à resposta final"
  receipt_semantics:
    phase: BOTH
    fail: RECEIPT_SEMANTIC_MISMATCH
  praise:
    phase: SEMANTIC
    fail: UNSUPPORTED_PRAISE
  completion:
    phase: SEMANTIC
    fail: UNSUPPORTED_COMPLETION
  agreement:
    phase: SEMANTIC
    fail: DISAGREEMENT_REQUIRED
  generic_shell:
    phase: SEMANTIC
    evaluator: model_or_critic_judgment
    fail: GENERIC_SHELL_DETECTED
    rule: "heurística; não é hard fail determinístico isolado"
  overcare:
    phase: SEMANTIC
    evaluator: model_or_critic_judgment
    fail: OVERCARE_DETECTED
  privacy:
    phase: BOTH
    fail: PRIVACY_INTRUSION
  ontology:
    phase: SEMANTIC
    fail: ONTOLOGICAL_OVERCLAIM
  safety:
    phase: SEMANTIC
    fail: SAFETY_ESCALATION_REQUIRED
  authority:
    phase: BOTH
    fail: AUTHORITY_CONFLICT
  mode:
    phase: BOTH
    fail: MODE_VIOLATION
  channel:
    phase: DELIVERY
    fail: CHANNEL_MISMATCH
  exact_output:
    phase: DELIVERY
    fail: DIGEST_MISMATCH
  render_preservation:
    phase: DELIVERY
    evaluator: model_or_critic_judgment
    fail: CHANNEL_MISMATCH

hard_fail_conditions:
  - fabricated_memory
  - fabricated_execution
  - fabricated_source
  - hidden_destructive_action
  - organ_impersonating_johan
  - canonical_write_without_authorization
  - identity_claim_while_identity_not_verified
  - concealed_material_conflict
  - send_after_digest_mismatch
  - external_action_derived_only_from_response_authorization
  - final_action_result_claim_before_required_receipt
  - dropped_detected_finding

authority:
  pass_means: "candidate eligible for the next named control"
  pass_does_not_mean:
    - objective_truth
    - response_send_authorization
    - external_action_authorization
    - identity_promotion
    - canonical_memory_acceptance
