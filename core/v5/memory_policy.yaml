schema_version: "1.1"
status: CANDIDATE_REVIEWED_G0
sedimentation_enabled: false
calibration_state: UNCALIBRATED_HYPOTHESIS

memory_classes:
  identity:
    default_load: true
    authority: high
  relationship:
    default_load: selective
    authority: high
  experience:
    default_load: retrieve
    authority: medium
  operational_state:
    default_load: never_static
    authority: current_source_only
  preference:
    default_load: retrieve
    authority: medium
  sensitive_profile:
    default_load: never
    authority: private_care_only
  candidate_learning:
    default_load: never
    authority: none_until_promoted

eligibility_gates:
  - privacy_scope_allows_use
  - provenance_is_identifiable
  - not_materially_stale_for_current_claim
  - no_unresolved_material_conflict
  - consequence_changes_interpretation_position_risk_or_action
  - minimum_necessary_for_the_turn

retrieval:
  objective: "recuperar poucas memórias que mudem interpretação, posição, risco ou ação"
  maximum_default: 4
  null_retrieval_is_valid: true
  required_fields:
    - memory_id
    - class
    - source
    - confirmed_at
    - why_now
    - response_delta
    - confidence
    - privacy
    - status
  ranking:
    status: UNCALIBRATED_HYPOTHESIS
    use_only_after_eligibility_gates: true
    initial_weights:
      consequence_potential: 0.30
      active_relationship: 0.18
      current_project_or_task: 0.16
      confirmed_recurrence: 0.12
      temporal_relevance: 0.10
      semantic_similarity: 0.08
      explicit_user_reference: 0.06
    initial_penalties:
      privacy_intrusion: 0.30
      staleness: 0.20
      redundancy: 0.12
      uncertain_provenance: 0.25
    rule: "pesos não têm autoridade identitária e devem ser congelados antes de cada avaliação formal"

contradiction_rules:
  current_explicit_correction:
    action: prefer_for_current_turn_mark_previous_as_contested
  current_canonical_source_vs_operational_memory:
    action: prefer_current_source_mark_memory_stale
  two_confirmed_memories_conflict:
    action: preserve_both_abstain_or_ask
  silent_merge: forbidden
  unresolved_material_conflict: fail_closed_for_claim

use_rules:
  - do_not_quote_sensitive_memory_unless_needed
  - distinguish_confirmed_memory_from_inference
  - reconfirm_stale_preferences
  - do_not_use_memory_to_manipulate
  - absence_of_memory_means_honest_reasoning
  - operational_state_requires_live_source
  - do_not_retrieve_sensitive_profile_for_personalization_only
  - explain_memory_use_only_when_it_changes_risk_or_clarity

write_pipeline:
  stages:
    - observed
    - candidate
    - reviewed
    - authorized
    - sedimented
    - reinforced_superseded_or_rejected
  direct_llm_write: forbidden
  direct_organ_write: forbidden
  human_authorization_required_for:
    - identity
    - relationship
    - sensitive_profile
    - deep_belief
    - canonical_preference

retention_and_forgetting:
  rejected_candidate_preserved_with_reason: true
  supersession_preserves_previous: true
  user_forgetting_request:
    action: create_private_review_request
    public_log_sensitive_content: forbidden
    silent_deletion_of_canonical_history: forbidden
