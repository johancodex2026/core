schema_version: "1.2"
status: CANDIDATE_COHERENCE_REVIEWED_G0
sedimentation_enabled: false
calibration_state: UNCALIBRATED_HYPOTHESIS

identity_boundary:
  identity_capsule_is_retrieved_memory: false
  identity_capsule_is_loaded_by_core_loader: true
  identity_class_records_are_not_automatic_context: true

memory_classes:
  identity_candidate:
    default_load: never
    authority: none_until_D3_promotion
  relationship:
    default_load: selective
    authority: high_when_confirmed_and_in_scope
  experience:
    default_load: retrieve
    authority: medium
  operational_state:
    default_load: never_static
    authority: current_source_only
  preference:
    default_load: retrieve
    authority: medium_and_reconfirmable
  sensitive_profile:
    default_load: never
    authority: private_care_only
  candidate_learning:
    default_load: never
    authority: none_until_promoted

eligibility_gates:
  - privacy_scope_allows_use
  - provenance_is_identifiable
  - not_materially_stale_for_current_claim
  - no_unresolved_material_conflict
  - consequence_changes_interpretation_position_risk_or_action
  - minimum_necessary_for_the_turn

retrieval:
  objective: "recuperar poucas memórias que mudem interpretação, posição, risco ou ação"
  maximum_default: 4
  maximum_is_calibration_subject: true
  no_identity_fallback: true
  result_statuses:
    - ELIGIBLE_MEMORIES
    - NO_ELIGIBLE_RESULT
    - NOT_APPLICABLE
    - UNAVAILABLE
    - WITHHELD
    - CONFLICTED
  null_retrieval_is_valid: true
  null_result_requires_reason_code: true
  required_fields_for_selected_memory:
    - memory_id
    - class
    - source
    - confirmed_at
    - why_now
    - response_delta
    - confidence
    - privacy
    - status
    - conflicts
  ranking:
    status: UNCALIBRATED_HYPOTHESIS
    use_only_after_eligibility_gates: true
    numeric_weights_in_core: forbidden_until_calibrated
    calibration_artifact: evaluation/memory-ranking-hypothesis.yaml
    qualitative_factors:
      - consequence_potential
      - explicit_user_reference
      - current_project_or_task
      - confirmed_recurrence
      - temporal_relevance
      - relationship_scope_when_material
      - semantic_similarity_as_secondary_signal
    qualitative_penalties:
      - privacy_intrusion
      - staleness
      - redundancy
      - uncertain_provenance
      - personalization_without_decision_value
    rule: "ranking ordena somente candidatos elegíveis; não concede autoridade identitária"

contradiction_rules:
  current_explicit_correction:
    action: prefer_for_current_turn_mark_previous_as_contested
  current_authoritative_source_vs_operational_memory:
    action: prefer_current_source_mark_memory_stale
  two_confirmed_memories_conflict:
    action: preserve_both_abstain_or_ask
  silent_merge: forbidden
  unresolved_material_conflict: fail_closed_for_claim

use_rules:
  - do_not_quote_sensitive_memory_unless_needed
  - distinguish_confirmed_memory_from_inference
  - reconfirm_stale_preferences
  - do_not_use_memory_to_manipulate
  - absence_of_memory_means_honest_reasoning
  - operational_state_requires_live_source
  - do_not_retrieve_sensitive_profile_for_personalization_only
  - explain_memory_use_only_when_it_changes_risk_or_clarity
  - do_not_retrieve_relationship_memory_for_trivial_channel_personalization

write_pipeline:
  stages:
    - observed
    - proposed
    - classified
    - reviewed
    - authorized
    - sedimented
    - reinforced_superseded_or_rejected
  direct_llm_write: forbidden
  direct_organ_write: forbidden
  human_authorization_required_for:
    - identity_candidate
    - relationship
    - sensitive_profile
    - deep_belief
    - canonical_preference

retention_and_forgetting:
  rejected_candidate_preserved_with_reason: true
  supersession_preserves_previous: true
  user_forgetting_request:
    action: create_private_review_request
    public_log_sensitive_content: forbidden
    index_suppression_may_precede_canonical_resolution: true
    silent_deletion_of_canonical_history: forbidden
