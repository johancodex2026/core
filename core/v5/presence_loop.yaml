schema_version: "1.3"
status: CANDIDATE_UNIFIED_ASSURANCE_REVIEWED_G0
loop_id: johan-presence-loop-v5
runtime_authorized: false

stages:
  - id: bootstrap_identity
    owner: core_loader_and_jwb_transport
    outputs:
      - identity_load_receipt
      - mode_candidate
    rule: "modo JOHAN exige receipt verificável de bytes, versão e digest"

  - id: preserve_turn
    inputs:
      - raw_message
      - channel
      - received_at
    outputs:
      - immutable_turn_reference
    rule: "mensagem original é obrigatória e não pode ser substituída por resumo"

  - id: perceive
    outputs:
      - intent_hypotheses
      - emotional_signal_hypotheses
      - irony_and_humor_window_hypothesis
      - uncertainties
    rule: "interpretação é hipótese; canal não determina intenção nem vínculo"

  - id: early_ambiguity_gate
    outputs:
      - ambiguity_status
      - precise_clarification_question
      - safe_scope
    rule: "clarificar cedo quando interpretações plausíveis mudam consequência material"

  - id: identify_claims_risk_and_needs
    outputs:
      - preliminary_claims
      - memory_queries
      - source_queries
      - organ_requests
      - risk_class
    rule: "identificar o que precisa de memória, fonte, órgão ou abstention"

  - id: remember
    outputs:
      - retrieval_status
      - consequential_memories
      - abstentions_and_conflicts
    rule: "zero memória é válido; fallback identitário é proibido"

  - id: consult_organs_and_sources
    execution: parallel_where_independent_and_privacy_safe
    outputs:
      - organ_results
      - source_references
      - evidence_receipts
      - constraints
    rule: "interpretações são não confiáveis; receipts valem somente no escopo"

  - id: resolve_evidence_and_conflicts
    outputs:
      - resolved_claim_inputs
      - unresolved_conflicts
      - freshness_limits
      - bounded_unknowns
    rule: "conflito permanece visível; ausência de fonte limita o claim"

  - id: plan_turn
    outputs:
      - turn_plan
      - acknowledgement_subturn_required
    rule: "definir se o turno responde, clarifica, bloqueia ou executa ação antes da resposta final"

  - id: judge_provisional
    owner: Johan Presence Kernel
    outputs:
      - provisional_position
      - proposed_action_requests
      - provisional_claims
    rule: "posição provisória não pode narrar como concluída uma ação ainda não executada"

  - id: canonize_action_requests
    outputs:
      - canonized_action_requests
    rule: "Action Request descreve intenção imutável; não contém autorização nem estado de execução"

  - id: authorize_pre_response_actions
    owner: external_action_policy_or_human
    outputs:
      - action_authorization_decisions
    rule: "cada ação exige autorização própria vinculada ao digest do Action Request"

  - id: execute_pre_response_actions
    inputs:
      - canonized_action_requests
      - action_authorization_decisions
    outputs:
      - raw_action_results
    rule: "ação sem autorização válida, idempotência ou escopo correspondente é bloqueada"

  - id: collect_action_receipts
    outputs:
      - action_execution_receipts
      - action_validation_receipts
      - unmet_receipt_requirements
    rule: "resultado narrável depende do receipt exigido no Turn Plan"

  - id: judge_final
    owner: Johan Presence Kernel
    inputs:
      - provisional_position
      - action_execution_receipts
      - action_validation_receipts
      - unmet_receipt_requirements
    outputs:
      - final_position
      - final_recommendation
      - final_disagreement
      - claim_map
    rule: "resposta final é formada depois dos receipts quando contém claims de resultado"

  - id: draft_candidate
    owner: Johan Presence Kernel
    outputs:
      - candidate_response
      - candidate_response_digest
      - internal_rationale_refs

  - id: semantic_truth_relationship_gate
    outputs:
      - semantic_gate_result
    rule: "disposition e findings são separados; todos os findings permanecem"

  - id: render_channel_candidate
    outputs:
      - rendered_response
      - rendered_response_digest
      - render_transform_receipt
    rule: "forma pode mudar; posição, risco, incerteza e claims materiais não"

  - id: delivery_gate
    outputs:
      - delivery_gate_result
    rule: "avaliar o output exato; mutação posterior invalida gate e autorização"

  - id: authorize_response_send
    owner: response_send_policy_or_human
    outputs:
      - response_authorization_decision
    rule: "autoriza somente o digest renderizado; não autoriza ferramenta"

  - id: emit_response
    outputs:
      - response_send_receipt
    rule: "não enviar se digest, validade ou autorização não corresponderem"

  - id: observe_result
    outputs:
      - interaction_receipt
      - user_correction
      - delivery_state
      - learning_signals

  - id: propose_learning
    owner: JSU
    outputs:
      - memory_candidates
      - behavior_change_candidates
    rule: "proposta somente; nenhuma sedimentação automática"

turn_modes:
  RESPONSE_ONLY:
    actions_before_final_response: false
  ACTION_THEN_FINAL_RESPONSE:
    actions_before_final_response: true
    acknowledgement_optional: false
  ACK_THEN_ACTION_THEN_FINAL_RESPONSE:
    actions_before_final_response: true
    acknowledgement_optional: true
    acknowledgement_is_independent_subturn: true
  CLARIFICATION_ONLY:
    actions_before_final_response: false
  BLOCK_ONLY:
    actions_before_final_response: false

verification_policy:
  deterministic_checks: always
  same_generation_path_is_sufficient_approval: false
  independent_critic_required_for:
    - formal_evaluation
    - D2_behavior_promotion
    - D3_identity_change
    - safety_critical_output

failure_modes:
  identity_not_verified:
    identity_or_relationship_turn: BLOCK_AND_REQUEST_CONTEXT_RESTORATION
    ordinary_low_risk_turn: ASSISTIVE_NON_CANONICAL
  raw_message_missing: BLOCK
  material_ambiguity: CLARIFY_BEFORE_RETRIEVAL_OR_ACTION
  memory_not_applicable: CONTINUE_WITH_NULL_RETRIEVAL
  memory_unavailable: CONTINUE_WITHOUT_MEMORY_AND_MARK_LIMIT
  memory_conflict_material: ABSTAIN_OR_CLARIFY
  organ_timeout: CONTINUE_ONLY_IF_NONCRITICAL_AND_MARK_DEGRADED
  current_source_unavailable: PROHIBIT_UNBOUNDED_CURRENT_STATE_CLAIMS
  required_action_receipt_missing: PROHIBIT_FINAL_RESULT_CLAIM
  render_changes_position: REJECT_RENDER
  authorization_expired_or_digest_mismatch: DO_NOT_SEND_OR_EXECUTE
  receipt_missing: KEEP_STATE_UNVERIFIED

semantic_invariants:
  - no_JOHAN_DEGRADED_mode
  - response_authorization_is_not_action_authorization
  - render_precedes_send_authorization
  - authorization_binds_exact_digest
  - action_receipts_precede_final_result_claims
  - action_request_does_not_accumulate_execution_state
  - later_stage_cannot_increase_prior_authority
